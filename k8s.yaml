# Single-file Kubernetes deployment for countriesinfo.
# The __DB_HOST__, __DB_USERNAME__, __DB_PASSWORD__ and __IMAGE__ placeholders
# are rendered by ./k8s-deploy.sh (or replace them manually).
apiVersion: v1
kind: Namespace
metadata:
  name: countriesinfo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: countriesinfo-config
  namespace: countriesinfo
data:
  PORT: "8000"
  # Background sync: immediate first run, then every SYNC_INTERVAL (ms)
  SYNC_INTERVAL: "86400000"
  # Snapshot cache TTL in seconds
  CACHE_TTL: "300"
  # Soft-delete vacuum: run interval (ms) and retention before hard delete
  VACUUM_INTERVAL: "3600000"
  VACUUM_RETENTION: "7d"
  # MySQL location, set per platform by k8s-deploy.sh
  DB_HOST: "__DB_HOST__"
  DB_PORT: "3306"
  DB_NAME: country_store
  # Connection pool
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  DB_MAX_CONN_TTL: "3600000"
---
apiVersion: v1
kind: Secret
metadata:
  name: countriesinfo-secret
  namespace: countriesinfo
type: Opaque
stringData:
  DB_USERNAME: "__DB_USERNAME__"
  DB_PASSWORD: "__DB_PASSWORD__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: countriesinfo
  namespace: countriesinfo
  labels:
    app: countriesinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: countriesinfo
  template:
    metadata:
      labels:
        app: countriesinfo
    spec:
      containers:
        - name: countriesinfo
          image: "__IMAGE__"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: countriesinfo-config
            - secretRef:
                name: countriesinfo-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: countriesinfo
  namespace: countriesinfo
spec:
  type: NodePort
  selector:
    app: countriesinfo
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
