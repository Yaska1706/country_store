apiVersion: v1
kind: Namespace
metadata:
  name: countriesinfo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: countriesinfo-config
  namespace: countriesinfo
data:
  PORT: "8000"
  SYNC_INTERVAL: "86400000"
  CACHE_TTL: "300"
  VACUUM_INTERVAL: "3600000"
  VACUUM_RETENTION: "7d"
  SPRING_PROFILES_ACTIVE: "k8s"
  DB_HOST: "__DB_HOST__"
  DB_PORT: "3306"
  DB_NAME: country_store
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  DB_MAX_CONN_TTL: "3600000"
---
apiVersion: v1
kind: Secret
metadata:
  name: countriesinfo-secret
  namespace: countriesinfo
stringData:
  DB_USERNAME: "__DB_USERNAME__"
  DB_PASSWORD: "__DB_PASSWORD__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
  namespace: countriesinfo
  labels:
    name: __SERVICE_NAME__
spec:
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      name: __SERVICE_NAME__
  template:
    metadata:
      labels:
        name: __SERVICE_NAME__
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: __SERVICE_NAME__
          image: "__IMAGE__"
          # Overrides the :latest -> Always default so local clusters use
          # the image loaded by k8s-deploy.sh instead of pulling.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: countriesinfo-config
            - secretRef:
                name: countriesinfo-secret
          env:
            # Size the JVM heap against the container memory limit
            # (512Mi limit -> ~384Mi max heap).
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  namespace: countriesinfo
spec:
  type: NodePort
  selector:
    name: __SERVICE_NAME__
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
