apiVersion: v1
kind: Namespace
metadata:
  name: countriesinfo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: countriesinfo-config
  namespace: countriesinfo
data:
  PORT: "8000"
  SYNC_INTERVAL: "86400000"
  CACHE_TTL: "300"
  VACUUM_INTERVAL: "3600000"
  VACUUM_RETENTION: "7d"
  SPRING_PROFILES_ACTIVE: "k8s"
  DB_HOST: "__DB_HOST__"
  DB_PORT: "3306"
  DB_NAME: country_store
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  DB_MAX_CONN_TTL: "3600000"
---
apiVersion: v1
kind: Secret
metadata:
  name: countriesinfo-secret
  namespace: countriesinfo
type: Opaque
stringData:
  DB_USERNAME: "__DB_USERNAME__"
  DB_PASSWORD: "__DB_PASSWORD__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_NAME__
  namespace: countriesinfo
  labels:
    app: countriesinfo
    name: __SERVICE_NAME__
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      name: __SERVICE_NAME__
  template:
    metadata:
      labels:
        app: countriesinfo
        name: __SERVICE_NAME__
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: __SERVICE_NAME__
          image: "__IMAGE__"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: countriesinfo-config
            - secretRef:
                name: countriesinfo-secret
          env:
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=75.0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  namespace: countriesinfo
spec:
  type: NodePort
  selector:
    name: __SERVICE_NAME__
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
