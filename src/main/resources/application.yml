server:
  port: ${PORT:8000}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:country_store}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useAffectedRows=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:development}
    hikari:
      maximum-pool-size: ${DB_MAX_CONNS:25}
      minimum-idle: ${DB_MIN_CONNS:5}
      max-lifetime: ${DB_MAX_CONN_TTL:3600000}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

app:
  soap:
    base-url: http://webservices.oorsprong.org/websamples.countryinfo/CountryInfoService.wso
    timeout: 10000
  sync:
    interval: ${SYNC_INTERVAL:86400000}
    initial-delay: 0
  vacuum:
    # Hard-deletes soft-deleted countries (languages cascade) after the
    # retention period; runs every interval.
    interval: ${VACUUM_INTERVAL:3600000}
    initial-delay: ${VACUUM_INITIAL_DELAY:60000}
    retention: ${VACUUM_RETENTION:7d}

# Upstream call policy mirrors the Go service: 3 attempts with exponential
# backoff (300ms base, jittered up to +50%), circuit breaker opens after
# 3 consecutive full failures and cools down for 30s.
resilience4j:
  circuitbreaker:
    instances:
      soapService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 3
        minimumNumberOfCalls: 3
        failureRateThreshold: 100
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 1
  retry:
    instances:
      soapService:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        randomizedWaitFactor: 0.5
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.HttpClientErrorException$TooManyRequests
          - org.springframework.web.client.ResourceAccessException
