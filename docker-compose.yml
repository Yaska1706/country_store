# Self-contained local stack: MySQL + the application.
# Configure credentials via the .env file or environment variables.
services:
  mysql:
    image: mysql:8.4
    container_name: countriesinfo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-development}
      MYSQL_DATABASE: ${DB_NAME:-country_store}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    image: countriesinfo:latest
    container_name: countriesinfo-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-country_store}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-development}
      PORT: "8000"
      SYNC_INTERVAL: ${SYNC_INTERVAL:-86400000}
      CACHE_TTL: ${CACHE_TTL:-300}
      VACUUM_INTERVAL: ${VACUUM_INTERVAL:-3600000}
      VACUUM_RETENTION: ${VACUUM_RETENTION:-7d}
      # Structured JSON logs on stdout
      SPRING_PROFILES_ACTIVE: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
